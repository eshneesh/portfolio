<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DWH // Lineage Control</title>
  <style>
    :root {
      --bg: #050706;
      --panel: rgba(7, 10, 8, .94);
      --ink: #f1efe8;
      --muted: #7c827d;
      --amber: #ff9f1c;
      --red: #ee3124;
      --green: #42ffc2;
      --line: rgba(241, 239, 232, .24);
      --system-color: var(--amber);
      --sans: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

    body {
      font-family: var(--sans);
      letter-spacing: .04em;
      background:
        radial-gradient(circle at 50% 45%, rgba(40, 88, 67, .11), transparent 34%),
        linear-gradient(rgba(66,255,194,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(66,255,194,.025) 1px, transparent 1px), #050706;
      background-size: auto, 40px 40px, 40px 40px;
    }

    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: .16;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.06) 4px);
      mix-blend-mode: overlay;
    }

    .shell { height: 100%; display: grid; grid-template-rows: 92px 1fr 30px; }

    .topbar {
      position: relative; z-index: 12; display: grid; grid-template-columns: 300px 1fr; align-items: stretch;
      border-bottom: 1px solid rgba(255,159,28,.45); background: rgba(3,5,4,.92); backdrop-filter: blur(16px);
    }

    .brand { display: flex; align-items: center; gap: 15px; padding: 12px 22px; border-right: 1px solid var(--line); }
    .brand-mark { position: relative; width: 52px; height: 52px; border: 2px solid var(--amber); transform: rotate(45deg); }
    .brand-mark::before, .brand-mark::after { content:""; position:absolute; inset: 7px; border: 1px solid rgba(255,159,28,.65); }
    .brand-mark::after { inset: 16px; background: var(--amber); box-shadow: 0 0 22px var(--amber); }
    .brand-copy { line-height: .86; }
    .brand-copy strong { display:block; font-size: 27px; letter-spacing: -.02em; }
    .brand-copy span { color: var(--amber); font: 9px var(--mono); letter-spacing: .23em; }

    .systems { min-width: 0; display: flex; align-items: center; padding: 0 18px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .systems::-webkit-scrollbar { display:none; }
    .system-tab {
      position: relative; height: 44px; min-width: 106px; padding: 0 16px; border: 1px solid transparent; background: transparent;
      color: #8d938e; cursor: pointer; text-transform: uppercase; font-weight: 800; font-size: 12px; letter-spacing: .14em; transition: .2s ease;
    }
    .system-tab::before { content:""; position:absolute; left: 10px; right:10px; bottom:-2px; height: 2px; transform: scaleX(0); background: currentColor; box-shadow:0 0 12px currentColor; transition:.2s; }
    .system-tab:hover { color: var(--ink); background: rgba(255,255,255,.035); }
    .system-tab.active { color: var(--tab-color, var(--amber)); border-color: currentColor; background: color-mix(in srgb, currentColor 8%, transparent); }
    .system-tab.active::before { transform:scaleX(1); }

    .workspace { position:relative; min-height:0; overflow:hidden; cursor:grab; user-select:none; -webkit-user-select:none; }
    .workspace.dragging { cursor:grabbing; }
    #graph { width:100%; height:100%; display:block; touch-action:none; }
    #graph text { user-select:none; -webkit-user-select:none; pointer-events:none; }

    .grid-major { stroke: rgba(66,255,194,.055); stroke-width: 1; }
    .grid-minor { stroke: rgba(255,255,255,.025); stroke-width: 1; }
    .link-hit { fill:none; stroke:transparent; stroke-width:18; cursor:pointer; }
    .link-base { fill:none; stroke:rgba(175,190,181,.28); stroke-width:1.2; vector-effect:non-scaling-stroke; stroke-linecap:square; stroke-linejoin:miter; }
    .link-flow { fill:none; stroke:var(--link-color, var(--green)); stroke-width:1.5; opacity:.32; vector-effect:non-scaling-stroke; stroke-linecap:square; stroke-linejoin:miter; filter:drop-shadow(0 0 3px var(--link-color, var(--green))); }
    .link-group.dimmed { opacity:.08; }
    .link-group.highlight .link-base { stroke:var(--ink); stroke-width:2; }
    .link-group.highlight .link-flow { stroke-width:3; opacity:1; }

    .node { cursor:pointer; transform-box: fill-box; transform-origin:center; transition: opacity .28s ease; }
    .node.dimmed { opacity:.09; }
    .node .frame { fill:rgba(6,9,7,.96); stroke:var(--node-color); stroke-width:1.3; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 7px rgba(0,0,0,.9)); }
    .node .corner { fill:none; stroke:var(--node-color); stroke-width:3; vector-effect:non-scaling-stroke; }
    .node .cap { fill:var(--node-color); opacity:.12; }
    .node .sys { fill:var(--node-color); font:bold 9px var(--mono); letter-spacing:.17em; }
    .node .name { fill:var(--ink); font:800 17px var(--sans); letter-spacing:.02em; }
    .node .description { fill:#929892; font:9px var(--sans); letter-spacing:.03em; }
    .node .field { fill:#b8bdb9; font:10px var(--mono); }
    .node .type { fill:#616762; font:8px var(--mono); text-anchor:end; }
    .node .key { fill:var(--node-color); font:bold 7px var(--mono); }
    .node .port { fill:#050706; stroke:var(--node-color); stroke-width:1.5; vector-effect:non-scaling-stroke; }
    .node:hover .frame, .node.selected .frame { stroke-width:2.5; filter:drop-shadow(0 0 12px color-mix(in srgb, var(--node-color) 55%, transparent)); }

    .hud { position:absolute; z-index:5; pointer-events:none; }
    .hud button { pointer-events:auto; }
    .zoom-hud { left:22px; bottom:22px; display:flex; gap:6px; }
    .hud-btn {
      width:40px; height:40px; border:1px solid rgba(241,239,232,.42); background:rgba(5,7,6,.86); color:var(--ink); cursor:pointer;
      font:18px var(--mono); transition:.2s; backdrop-filter:blur(8px);
    }
    .hud-btn:hover { color:var(--amber); border-color:var(--amber); }
    .zoom-readout { min-width:70px; width:auto; padding:0 10px; color:var(--green); font-size:10px; }

    .detail {
      position:absolute; z-index:9; top:18px; right:18px; bottom:18px; width:min(390px, calc(100vw - 36px));
      border:1px solid rgba(255,159,28,.75); background:var(--panel); backdrop-filter:blur(18px); transform:translateX(calc(100% + 36px));
      transition:transform .42s cubic-bezier(.2,.82,.2,1); box-shadow:0 0 50px rgba(0,0,0,.72); overflow:hidden;
      user-select:text; -webkit-user-select:text;
    }
    .detail.open { transform:translateX(0); }
    .detail::before { content:""; position:absolute; left:0; right:0; top:0; height:4px; background:var(--detail-color, var(--amber)); box-shadow:0 0 15px var(--detail-color, var(--amber)); }
    .detail-head { display:flex; align-items:flex-start; justify-content:space-between; padding:24px 24px 18px; border-bottom:1px solid var(--line); }
    .detail-head > div { min-width:0; }
    .detail-kicker { color:var(--detail-color, var(--amber)); font:9px var(--mono); letter-spacing:.2em; }
    .detail h2 { margin:7px 0 0; max-width:300px; font-size:clamp(19px, 1.55vw, 23px); line-height:1.05; letter-spacing:-.02em; text-transform:uppercase; overflow-wrap:anywhere; }
    .close { width:34px; height:34px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
    .detail-scroll { height:calc(100% - 93px); overflow:auto; padding:20px 24px 28px; }
    .detail-desc { color:#a7ada8; font-size:13px; line-height:1.55; margin:0 0 20px; letter-spacing:.02em; }
    .detail-label { display:flex; align-items:center; gap:8px; color:#777e78; font:9px var(--mono); letter-spacing:.16em; margin:22px 0 9px; }
    .detail-label::after { content:""; height:1px; flex:1; background:var(--line); }
    .field-list { border-top:1px solid var(--line); }
    .field-row { display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:8px; align-items:center; min-height:42px; border-bottom:1px solid var(--line); font:10px var(--mono); }
    .field-row > :nth-child(2) { overflow-wrap:anywhere; }
    .field-row.linked { background:linear-gradient(90deg, color-mix(in srgb, var(--detail-color) 13%, transparent), transparent); }
    .field-icon { color:var(--detail-color); font-size:8px; }
    .field-type { color:#666c67; }
    .relation { padding:10px 12px; border:1px solid var(--line); margin-top:8px; font:10px var(--mono); color:#aeb4af; }
    .relation em { color:var(--detail-color); font-style:normal; }
    .relation-tag { float:right; margin-left:8px; color:#777e78; font-size:8px; letter-spacing:.12em; }

    .bottombar { z-index:11; display:flex; align-items:center; justify-content:flex-end; padding:0 20px; border-top:1px solid var(--line); background:#050706; font:9px var(--mono); color:#69706a; letter-spacing:.13em; }
    .coordinates { text-align:right; }

    .empty-label { fill:#525853; font:bold 17px var(--mono); letter-spacing:.18em; text-anchor:middle; }

    @media (max-width: 850px) {
      .shell { grid-template-rows:72px 1fr 30px; }
      .topbar { grid-template-columns:170px 1fr; }
      .brand { padding:8px 13px; }
      .brand-mark { width:38px; height:38px; }
      .brand-mark::after { inset:12px; }
      .brand-copy strong { font-size:20px; }
      .brand-copy span { display:none; }
      .systems { padding:0 8px; }
      .system-tab { min-width:88px; padding:0 10px; font-size:10px; }
      .detail { top:10px; right:10px; bottom:10px; width:min(350px, calc(100vw - 20px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="DWH Lineage Control">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy"><strong>DWH//01</strong><span>LINEAGE CONTROL</span></div>
      </div>
      <nav class="systems" aria-label="Фильтр систем" id="systemTabs"></nav>
    </header>

    <section class="workspace" id="workspace" aria-label="Интерактивная карта связей таблиц">
      <svg id="graph" role="img" aria-labelledby="graphTitle graphDesc">
        <title id="graphTitle">Карта связей таблиц хранилища данных</title>
        <desc id="graphDesc">Масштабируйте колесом мыши, перемещайте карту перетаскиванием и выбирайте таблицы для просмотра полей.</desc>
        <defs>
          <pattern id="minorGrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" class="grid-minor" fill="none"/></pattern>
          <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="url(#minorGrid)"/><path d="M 120 0 L 0 0 0 120" class="grid-major" fill="none"/></pattern>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g id="viewport">
          <rect x="-5000" y="-3000" width="24000" height="10000" fill="url(#majorGrid)"/>
          <g id="links"></g>
          <g id="nodes"></g>
        </g>
      </svg>

      <div class="hud zoom-hud">
        <button class="hud-btn" id="zoomOut" aria-label="Уменьшить масштаб">−</button>
        <button class="hud-btn zoom-readout" id="zoomReadout" aria-label="Текущий масштаб">100%</button>
        <button class="hud-btn" id="zoomIn" aria-label="Увеличить масштаб">+</button>
        <button class="hud-btn" id="zoomFit" aria-label="Показать всю схему">⌗</button>
      </div>

      <aside class="detail" id="detail" aria-live="polite" aria-label="Сведения о таблице">
        <div class="detail-head">
          <div><div class="detail-kicker" id="detailKicker"></div><h2 id="detailTitle"></h2></div>
          <button class="close" id="closeDetail" aria-label="Закрыть">×</button>
        </div>
        <div class="detail-scroll">
          <p class="detail-desc" id="detailDesc"></p>
          <div class="detail-label">ПОЛЯ / COLUMNS</div>
          <div class="field-list" id="detailFields"></div>
          <div class="detail-label">СВЯЗИ / RELATIONS</div>
          <div id="detailRelations"></div>
        </div>
      </aside>
    </section>

    <footer class="bottombar">
      <div class="coordinates" id="coordinates">X +0000 / Y +0000 / Z 1.00</div>
    </footer>
  </main>

  <!-- SCHEMA_DATA_END -->
  <script>
    const importedSchema = JSON.parse(document.querySelector('#importedSchema').textContent);
    const systems = {
      ALL: { label: 'Все системы', color: '#f1efe8' },
      ...importedSchema.systems
    };
    const tables = importedSchema.tables;
    const relations = importedSchema.relations;

    const NS = 'http://www.w3.org/2000/svg';
    const graph = document.querySelector('#graph');
    const viewport = document.querySelector('#viewport');
    const workspace = document.querySelector('#workspace');
    const nodesLayer = document.querySelector('#nodes');
    const linksLayer = document.querySelector('#links');
    const nodeW = 260, compactH = 106, rowH = 24, maxInlineFields = 12;
    let activeSystem = 'ALL', selectedId = null;
    let transform = { x: 30, y: 0, k: .78 };
    let drag = null, moved = false, suppressClick = false;

    function el(name, attrs={}, text='') {
      const n = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([k,v]) => k === 'class' ? n.setAttribute('class',v) : n.setAttribute(k,v));
      if (text) n.textContent = text;
      return n;
    }

    function inlineFields(table) {
      if (selectedId !== table.id) return [];
      const linkedNames = new Set();
      relations.forEach(relation => {
        if (relation.source===table.id) linkedNames.add(relation.sourceField);
        if (relation.target===table.id) linkedNames.add(relation.targetField);
      });
      const linked=table.fields.filter(field=>linkedNames.has(field[0]));
      const remaining=table.fields.filter(field=>!linkedNames.has(field[0]));
      return [...linked,...remaining].slice(0,maxInlineFields);
    }

    function pointFor(table, field, side) {
      if (selectedId !== table.id) return { x: table.x + (side === 'right' ? nodeW : 0), y: table.y + compactH/2 };
      const visible=inlineFields(table);
      const index=visible.findIndex(item=>item[0]===field);
      const y=index<0 ? compactH/2 : compactH+index*rowH+rowH/2;
      return { x:table.x+(side==='right'?nodeW:0), y:table.y+y };
    }

    function nodeHeight(table) {
      if (selectedId!==table.id) return compactH;
      const visible=inlineFields(table);
      return compactH+visible.length*rowH+(table.fields.length>visible.length?rowH:10);
    }

    function compactName(name,max=30) {
      return name.length<=max ? name : name.slice(0,max-1)+'…';
    }

    function descriptionLines(text, max=39) {
      const words=text.split(/\s+/), lines=[''];
      words.forEach(word => {
        const current=lines[lines.length-1];
        if ((current+' '+word).trim().length <= max) lines[lines.length-1]=(current+' '+word).trim();
        else if (lines.length < 2) lines.push(word);
      });
      if (lines.length===2 && text.length > lines.join(' ').length) lines[1]=lines[1].replace(/[.…]?$/,'…');
      return lines;
    }

    function linkPath(rel) {
      const s = tables.find(t=>t.id===rel.source), t = tables.find(t=>t.id===rel.target);
      const index = relations.indexOf(rel);
      const lane = ((index % 5) - 2) * 14;
      const sameColumn = Math.abs(t.x-s.x) < nodeW*.75;

      if (sameColumn) {
        const side = index % 2 === 0 ? 'right' : 'left';
        const a = pointFor(s,rel.sourceField,side), b = pointFor(t,rel.targetField,side);
        const direction = side === 'right' ? 1 : -1;
        const outerX = (direction > 0 ? Math.max(a.x,b.x) : Math.min(a.x,b.x)) + direction*(72+Math.abs(lane));
        return `M${a.x},${a.y} H${outerX} V${b.y} H${b.x}`;
      }

      const forward = s.x < t.x;
      const direction = forward ? 1 : -1;
      const a = pointFor(s,rel.sourceField,forward?'right':'left');
      const b = pointFor(t,rel.targetField,forward?'left':'right');
      const lead = Math.min(92,Math.max(46,Math.abs(b.x-a.x)*.18));
      const firstX = a.x+direction*lead, lastX = b.x-direction*lead;
      let routeY = (a.y+b.y)/2+lane;
      if (Math.abs(routeY-a.y)<22 && Math.abs(routeY-b.y)<22) routeY += index%2===0 ? -38 : 38;
      return `M${a.x},${a.y} H${firstX} V${routeY} H${lastX} V${b.y} H${b.x}`;
    }

    function renderTabs() {
      const tabs = document.querySelector('#systemTabs');
      tabs.innerHTML='';
      Object.entries(systems).forEach(([key,s]) => {
        const b = document.createElement('button');
        b.className = `system-tab${activeSystem===key?' active':''}`;
        b.style.setProperty('--tab-color',s.color); b.textContent=s.label; b.dataset.system=key;
        const count=key==='ALL'?tables.length:tables.filter(table=>table.system===key).length;
        b.setAttribute('aria-label',`${s.label}: ${count} таблиц`);
        b.addEventListener('click',()=>setSystem(key)); tabs.appendChild(b);
      });
    }

    function renderGraph() {
      linksLayer.innerHTML=''; nodesLayer.innerHTML='';
      relations.forEach(rel => {
        const source = tables.find(t=>t.id===rel.source), target=tables.find(t=>t.id===rel.target);
        const g=el('g',{class:'link-group', 'data-id':rel.id, style:`--link-color:${source.color||systems[source.system].color}`});
        const d=linkPath(rel);
        g.append(el('path',{d,class:'link-base'}),el('path',{d,class:'link-flow'}),el('path',{d,class:'link-hit'}));
        g.querySelector('.link-hit').addEventListener('click',ev=>{
          if (suppressClick) return;
          ev.stopPropagation(); selectTable(rel.source, rel.id);
        });
        linksLayer.appendChild(g);
      });

      const renderOrder = selectedId
        ? [...tables.filter(table=>table.id!==selectedId), ...tables.filter(table=>table.id===selectedId)]
        : tables;
      renderOrder.forEach(table => {
        const color=table.color||systems[table.system].color, expanded=selectedId===table.id, h=nodeHeight(table);
        const visibleFields=inlineFields(table);
        const g=el('g',{class:'node',transform:`translate(${table.x} ${table.y})`,tabindex:'0',role:'button','aria-label':`${table.system}, таблица ${table.name}`,style:`--node-color:${color}`,'data-id':table.id});
        g.appendChild(el('title',{},`${table.system}.${table.name}`));
        g.appendChild(el('rect',{class:'frame',width:nodeW,height:h,rx:1}));
        g.appendChild(el('path',{class:'corner',d:`M0 18V0h18 M${nodeW-18} 0h18v18 M${nodeW} ${h-18}v18h-18`}));
        g.appendChild(el('rect',{class:'cap',x:1,y:1,width:nodeW-2,height:compactH-5}));
        g.appendChild(el('text',{class:'sys',x:17,y:19},`${table.system} / ${table.domainLabel||'TABLE'}`));
        g.appendChild(el('text',{class:'name',x:17,y:44},compactName(table.name)));
        descriptionLines(table.desc).forEach((line,i)=>g.appendChild(el('text',{class:'description',x:17,y:69+i*15},line)));
        if (expanded) visibleFields.forEach((f,i)=>{
            const y=compactH+i*rowH;
            g.appendChild(el('line',{x1:1,y1:y,x2:nodeW-1,y2:y,stroke:'rgba(241,239,232,.12)','stroke-width':'1'}));
            if(f[2]) g.appendChild(el('text',{class:'key',x:12,y:y+16},f[2]));
            g.appendChild(el('text',{class:'field',x:42,y:y+16},f[0]));
            g.appendChild(el('text',{class:'type',x:nodeW-13,y:y+16},f[1]));
            if(relations.some(r=>(r.source===table.id&&r.sourceField===f[0])||(r.target===table.id&&r.targetField===f[0]))) {
              g.appendChild(el('circle',{class:'port',cx:nodeW,cy:y+rowH/2,r:3.5}));
              g.appendChild(el('circle',{class:'port',cx:0,cy:y+rowH/2,r:3.5}));
            }
          });
        if (expanded && table.fields.length>visibleFields.length) {
          const y=compactH+visibleFields.length*rowH;
          g.appendChild(el('line',{x1:1,y1:y,x2:nodeW-1,y2:y,stroke:'rgba(241,239,232,.12)','stroke-width':'1'}));
          g.appendChild(el('text',{class:'field',x:17,y:y+16},`+ ${table.fields.length-visibleFields.length} ПОЛЕЙ — В ПАНЕЛИ`));
        }
        if (!expanded && relations.some(r=>r.source===table.id||r.target===table.id)) {
          g.appendChild(el('circle',{class:'port',cx:nodeW,cy:compactH/2,r:3.5}));
          g.appendChild(el('circle',{class:'port',cx:0,cy:compactH/2,r:3.5}));
        }
        g.addEventListener('click',ev=>{
          if (suppressClick) return;
          ev.stopPropagation(); selectTable(table.id);
        });
        g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectTable(table.id)}});
        nodesLayer.appendChild(g);
      });
      updateVisibility(); updateTransform();
    }

    function updateVisibility() {
      const visible = t => activeSystem==='ALL'||t.system===activeSystem;
      document.querySelectorAll('.node').forEach(n=>n.classList.toggle('dimmed',!visible(tables.find(t=>t.id===n.dataset.id))));
      document.querySelectorAll('.link-group').forEach(g=>{
        const r=relations.find(r=>r.id===g.dataset.id), s=tables.find(t=>t.id===r.source),t=tables.find(t=>t.id===r.target);
        g.classList.toggle('dimmed',activeSystem!=='ALL'&&!visible(s)&&!visible(t));
      });
    }

    function setSystem(key) {
      activeSystem=key; closeDetail(); renderTabs(); fitView();
    }

    function selectTable(id, relationId=null) {
      if (selectedId===id && !relationId) { closeDetail(); return; }
      selectedId=id; const table=tables.find(t=>t.id===id), color=table.color||systems[table.system].color;
      renderGraph();
      document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));
      document.querySelectorAll('.link-group').forEach(g=>{
        const r=relations.find(r=>r.id===g.dataset.id);
        g.classList.toggle('highlight',relationId?g.dataset.id===relationId:(r.source===id||r.target===id));
        if(selectedId) g.classList.toggle('dimmed',!(r.source===id||r.target===id));
      });
      document.querySelectorAll('.node').forEach(n=>{
        const related=relations.some(r=>(r.source===id&&r.target===n.dataset.id)||(r.target===id&&r.source===n.dataset.id));
        n.classList.toggle('dimmed',n.dataset.id!==id&&!related);
      });
      openDetail(table);
    }

    function openDetail(table) {
      const color=table.color||systems[table.system].color, related=relations.filter(r=>r.source===table.id||r.target===table.id);
      const panel=document.querySelector('#detail'); panel.style.setProperty('--detail-color',color);
      document.querySelector('#detailKicker').textContent=`${table.system} / ${table.domainLabel||'TABLE'} / ${table.fields.length} COLUMNS`;
      document.querySelector('#detailTitle').textContent=table.name; document.querySelector('#detailDesc').textContent=table.desc;
      document.querySelector('#detailFields').innerHTML=table.fields.map(f=>{
        const linked=related.some(r=>(r.source===table.id?r.sourceField:r.targetField)===f[0]);
        return `<div class="field-row${linked?' linked':''}"><span class="field-icon">${f[2]||'•'}</span><span>${f[0]}</span><span class="field-type">${f[1]}</span></div>`;
      }).join('');
      document.querySelector('#detailRelations').innerHTML=related.length?related.map(r=>{
        const outgoing=r.source===table.id, other=tables.find(t=>t.id===(outgoing?r.target:r.source));
        const confidence=r.confidence==='high'?'HIGH':r.confidence==='medium'?'MED':'LOW';
        return `<div class="relation"><span class="relation-tag">INFERRED ${confidence}</span><em>${outgoing?'OUT':'IN '}</em> ${outgoing?r.sourceField:r.targetField}　→　${other.system}.${other.name}.${outgoing?r.targetField:r.sourceField}</div>`;
      }).join(''):'<div class="relation">NO ACTIVE RELATIONS</div>';
      panel.classList.add('open');
    }

    function closeDetail() {
      selectedId=null; document.querySelector('#detail').classList.remove('open');
      renderGraph();
    }

    function updateTransform() {
      viewport.setAttribute('transform',`translate(${transform.x} ${transform.y}) scale(${transform.k})`);
      document.querySelector('#zoomReadout').textContent=`${Math.round(transform.k*100)}%`;
      const signed = value => `${value >= 0 ? '+' : '−'}${Math.abs(Math.round(value)).toString().padStart(4,'0')}`;
      document.querySelector('#coordinates').textContent=`X ${signed(transform.x)} / Y ${signed(transform.y)} / Z ${transform.k.toFixed(2)}`;
    }

    function zoomAt(factor,cx=workspace.clientWidth/2,cy=workspace.clientHeight/2) {
      const old=transform.k, next=Math.min(2.4,Math.max(.02,old*factor));
      transform.x=cx-(cx-transform.x)*(next/old); transform.y=cy-(cy-transform.y)*(next/old); transform.k=next; updateTransform();
    }

    function fitView() {
      const relevant=tables.filter(t=>activeSystem==='ALL'||t.system===activeSystem);
      const minX=Math.min(...relevant.map(t=>t.x))-80,maxX=Math.max(...relevant.map(t=>t.x+nodeW))+80;
      const minY=Math.min(...relevant.map(t=>t.y))-80,maxY=Math.max(...relevant.map(t=>t.y+nodeHeight(t)))+80;
      const k=Math.min(1.05,workspace.clientWidth/(maxX-minX),workspace.clientHeight/(maxY-minY));
      transform.k=Math.max(.02,k); transform.x=(workspace.clientWidth-(minX+maxX)*transform.k)/2; transform.y=(workspace.clientHeight-(minY+maxY)*transform.k)/2; updateTransform();
    }

    workspace.addEventListener('wheel',e=>{e.preventDefault(); const r=workspace.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top)},{passive:false});
    workspace.addEventListener('pointerdown',e=>{
      if(e.button!==0 || e.target.closest?.('.detail,.hud')) return;
      drag={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y,pointerId:e.pointerId}; moved=false;
    });
    workspace.addEventListener('pointermove',e=>{
      if(!drag || e.pointerId!==drag.pointerId) return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!moved && Math.hypot(dx,dy)<5) return;
      if(!moved) {
        moved=true; suppressClick=true;
        workspace.setPointerCapture(e.pointerId);
        workspace.classList.add('dragging');
      }
      transform.x=drag.tx+dx; transform.y=drag.ty+dy; updateTransform();
    });
    function endDrag(e) {
      if(!drag || e.pointerId!==drag.pointerId) return;
      if(workspace.hasPointerCapture?.(e.pointerId)) workspace.releasePointerCapture(e.pointerId);
      drag=null; moved=false; workspace.classList.remove('dragging');
      setTimeout(()=>{ suppressClick=false; },0);
    }
    workspace.addEventListener('pointerup',endDrag);
    workspace.addEventListener('pointercancel',endDrag);
    workspace.addEventListener('click',e=>{
      if(suppressClick || e.target.closest?.('.detail,.hud,.node,.link-group')) return;
      closeDetail();
    });
    workspace.addEventListener('dragstart',e=>e.preventDefault());
    document.querySelector('#zoomIn').onclick=()=>zoomAt(1.22); document.querySelector('#zoomOut').onclick=()=>zoomAt(.82); document.querySelector('#zoomFit').onclick=fitView;
    document.querySelector('#zoomReadout').onclick=()=>{transform.k=1;updateTransform()}; document.querySelector('#closeDetail').onclick=closeDetail;
    window.addEventListener('resize',()=>{if(!selectedId)fitView()});

    renderTabs(); renderGraph(); requestAnimationFrame(fitView);
  </script>
</body>
</html>
